<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>favicon check</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="shell" style="padding-block:3rem">
  <p class="eyebrow">Favicon — rendered at real sizes</p>
  <div style="display:flex;gap:3rem;flex-wrap:wrap">
    <div>
      <p class="mono muted" style="margin-bottom:.75rem">monogram (chosen)</p>
      <div style="display:flex;gap:1.25rem;align-items:flex-end">
        <img src="favicon.svg" width="16" height="16" alt=""><img src="favicon.svg" width="32" height="32" alt=""><img src="favicon.svg" width="64" height="64" alt="">
      </div>
    </div>
    <div>
      <p class="mono muted" style="margin-bottom:.75rem">mark (alternative)</p>
      <div style="display:flex;gap:1.25rem;align-items:flex-end">
        <img src="favicon-mark.svg" width="16" height="16" alt=""><img src="favicon-mark.svg" width="32" height="32" alt=""><img src="favicon-mark.svg" width="64" height="64" alt="">
      </div>
    </div>
  </div>
  <p class="mono muted" style="margin-top:2.5rem">on a tab strip (16px)</p>
  <div style="display:flex;gap:.5rem;align-items:center;background:var(--muted);padding:.5rem .75rem;border-radius:8px;width:max-content;margin-top:.5rem">
    <img src="favicon.svg" width="16" height="16" alt=""><span style="font-size:.8125rem">Patrik Pukan — Software Engineer</span>
  </div>
  <div style="display:flex;gap:.5rem;align-items:center;background:var(--muted);padding:.5rem .75rem;border-radius:8px;width:max-content;margin-top:.5rem">
    <img src="favicon-mark.svg" width="16" height="16" alt=""><span style="font-size:.8125rem">Patrik Pukan — Software Engineer</span>
  </div>
</div></body></html>
